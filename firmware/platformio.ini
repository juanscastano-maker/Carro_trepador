; Firmware del Carro Trepador
; Placa: ESP32-S3 CAM N16R8 (16 MB de flash, 8 MB de PSRAM octal) con cámara OV2640.
; Conexiones y consideraciones: docs/electronica/Conexiones_Carro_trepador_v3.docx
;
; Entornos:
;   esp32s3_cam        firmware del robot (micro-ROS). Hoy es un esqueleto.
;   prueba_camara      cámara OV2640 + video HTTP MJPEG
;   prueba_imus        las dos MPU6050 con sus pines INT
;   prueba_motores     DRV8833 + 4 motores N20 con rampa de aceleración
;   prueba_potencia    INA226 (voltaje, corriente, potencia y ALERT)
;   prueba_esc         2 ESC Skywalker V2 + turbinas con rampa de aceleración
;
; Uso:  pio run -e prueba_imus -t upload && pio device monitor
; Las pruebas no usan micro-ROS, así que compilan rápido.

; ---------- Configuración común a todos los entornos ----------
[env]
platform = espressif32 @ ~6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Memoria del módulo N16R8. La cámara necesita la PSRAM para los cuadros JPEG.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Serial por el puerto USB-C del CH340 (UART0). El puerto USB OTG no se usa.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------- Firmware del robot ----------
[env:esp32s3_cam]
build_src_filter = +<main.cpp> +<robot/>
board_microros_distro = humble
board_microros_transport = wifi
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; ---------- Pruebas de hardware (una por subsistema) ----------
[env:prueba_camara]
build_src_filter = +<pruebas/prueba_camara.cpp>

[env:prueba_imus]
build_src_filter = +<pruebas/prueba_imus.cpp>

[env:prueba_motores]
build_src_filter = +<pruebas/prueba_motores.cpp>

[env:prueba_potencia]
build_src_filter = +<pruebas/prueba_potencia.cpp>

[env:prueba_esc]
build_src_filter = +<pruebas/prueba_esc.cpp>
